services:
  application:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ${ARL_CHECKPOINT:-./checkpoints/model.pt}:/models/model.pt:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import adversarial_robustness_lab"]
      interval: 30s
      timeout: 3s
      retries: 3
