[project]
name = "adversarial-robustness-lab"
version = "0.1.0"
description = "Evasion attacks, adversarial training and randomized smoothing certification for CIFAR-10 classifiers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy>=2.5",
    "torch>=2.15",
]

[dependency-groups]
# Opt-in reference comparisons: torchattacks for attack parity and strength,
# SciPy and statsmodels for the Clopper-Pearson and beta-function parity tests.
validation = [
    "torchattacks>=3.5.1",
    "scipy>=1.18",
    "statsmodels>=0.15",
]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-cov>=7.0",
    "hypothesis>=6.170",
    "pre-commit>=4.3",
]

[project.scripts]
adversarial-robustness-lab = "adversarial_robustness_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adversarial_robustness_lab"]

# CPU wheels of torch on Linux (CI and Docker); macOS wheels come from PyPI and include MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
# N812/N806: torch.nn.functional as F and math-style capital names (X, Y, N) are conventional here.
ignore = ["N812", "N806", "N803"]

[tool.ruff.lint.per-file-ignores]
# Markdown table rows are clearer on one line.
"benchmarks/report.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["adversarial_robustness_lab"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
# torch modules subclass nn.Module, which mypy sees as Any in some torch builds.
disallow_subclassing_any = false
disallow_untyped_calls = false
# torch operators are typed as returning Any.
warn_return_any = false

[[tool.mypy.overrides]]
module = ["torchattacks.*", "scipy.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "validation: needs the validation group (torchattacks, SciPy, statsmodels)",
    "slow: longer integration tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
